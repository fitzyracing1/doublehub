<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>doublehub: finish your GitHub App</title>
<style>:root{--bg:#f7f8fa;--card:#fff;--fg:#14171c;--muted:#59606b;--line:#e3e6eb;--accent:#4f46e5;--accent-fg:#fff;--code:#f1f3f6;color-scheme:light dark}@media (prefers-color-scheme:dark){:root{--bg:#0d1016;--card:#161a22;--fg:#e8eaee;--muted:#a3aab6;--line:#2a303b;--accent:#8b85ff;--accent-fg:#0d1016;--code:#0f131a}}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.6 system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;padding:24px 16px}main{max-width:560px;margin:0 auto;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:24px}main.wide{max-width:960px}.brand{font-weight:700;color:var(--muted);font-size:.9rem;margin:0 0 .5rem}h2{margin:0 0 .8rem;letter-spacing:-.01em}a{color:var(--accent)}code,pre{font:13px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;background:var(--code);border-radius:6px;padding:.1rem .3rem;word-break:break-all}pre{display:block;border:1px solid var(--line);padding:.7rem;max-height:240px;overflow:auto;white-space:pre-wrap}small{color:var(--muted)}form{display:flex;gap:.6rem;flex-wrap:wrap;margin:1rem 0}button{font:inherit;font-weight:600;border-radius:10px;padding:.65rem 1.2rem;min-height:44px;border:1px solid var(--line);background:var(--card);color:var(--fg);cursor:pointer}button[value=allow]{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}:focus-visible{outline:3px solid var(--accent);outline-offset:2px}.tbl{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:.9rem}td,th{border-bottom:1px solid var(--line);padding:.5rem;text-align:left}th{color:var(--muted);font-size:.8rem;text-transform:uppercase}main{max-width:720px}textarea{width:100%;font:13px ui-monospace,Menlo,monospace;background:var(--code);color:var(--fg);border:1px solid var(--line);border-radius:9px;padding:.6rem}</style>
<main><h2>doublehub</h2><div id="s">Finishing your GitHub App...</div></main>
<script>
const code=new URLSearchParams(location.search).get('code'),s=document.getElementById('s');
if(!code){s.textContent='No code in the link. Start again from the doublehub page.'}else{
fetch('https://api.github.com/app-manifests/'+encodeURIComponent(code)+'/conversions',{method:'POST',headers:{Accept:'application/vnd.github+json'}})
.then(r=>r.ok?r.json():Promise.reject(r.status)).then(a=>{
const pem=URL.createObjectURL(new Blob([a.pem],{type:'application/x-pem-file'}));
const inst='https://github.com/apps/'+a.slug+'/installations/new';
s.innerHTML=`<p>Your app <b>${a.name}</b> is created (ID ${a.id}).</p>
<p><a download="${a.slug}.private-key.pem" href="${pem}">Download your private key</a>. Save it now: this page is the only time it's shown, and it never leaves your browser.</p>
<p>Install link: <a href="${inst}">${inst}</a></p>
<p>Badge:</p><textarea rows=2>[![Install on GitHub](https://img.shields.io/badge/Install%20on-GitHub-black?logo=github)](${inst})</textarea>
<p>Webhook secret and client secret are in your app settings: <a href="${a.html_url}">${a.html_url}</a></p>`})
.catch(e=>{s.innerHTML=`<p>Couldn't finish in the browser (${e}). Run this within an hour of creating the app:</p><pre>curl -X POST https://api.github.com/app-manifests/${code}/conversions</pre>`})}
</script>
